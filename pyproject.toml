[project]
name = "sidd-denoise"
version = "0.1.0"
description = "Real-noise image denoising on SIDD: NAFNet from scratch vs synthetic-to-real transfer (SCUNet / DRUNet, full, LoRA and head-only fine-tuning)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "numpy",
    "scipy",
    "h5py",
    "scikit-image",
    "opencv-python-headless",
    "einops",
    "lpips",
    "bm3d",
    "tqdm",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
extra = ["pyiqa"]          # DISTS; optional, LPIPS works without it
dev = ["pytest", "jupyter", "nbconvert", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidd_denoise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
